<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iOS PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Eurojackpot">
    
    <!-- App Icons -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">

    <title>Eurojackpot Mega Mavridis Live 3D</title>
    
    <!-- Three.js Library for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #080414;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 10px;
            background: rgba(15, 8, 30, 0.7);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(241, 196, 15, 0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.5rem;
            color: #f1c40f;
            text-shadow: 0 0 12px rgba(241, 196, 15, 0.8);
        }

        .subtitle {
            font-size: 0.8rem;
            color: #ff9ff3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fairy-status {
            font-size: 1rem;
            color: #ff9ff3;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,159,243,0.8);
            margin: 10px 0;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 15px;
        }

        .results-panel {
            background: rgba(18, 10, 36, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(241, 196, 15, 0.4);
            border-radius: 20px;
            padding: 12px;
            width: 100%;
            margin-top: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .section-title {
            font-size: 0.85rem;
            color: #ffeaa7;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-align: center;
        }

        .balls-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .ball-slot {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(241, 196, 15, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f1c40f;
            transition: all 0.4s ease;
        }

        .ball-slot.star-slot {
            border-color: rgba(255, 107, 129, 0.5);
            color: #ff7675;
        }

        .ball-slot.filled {
            background: radial-gradient(circle at 35% 35%, #ffeaa7, #d35400);
            border: 2px solid #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.9);
            transform: scale(1.08);
        }

        .ball-slot.star-slot.filled {
            background: radial-gradient(circle at 35% 35%, #ff7675, #c0392b);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 107, 129, 0.9);
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .btn {
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .btn-main {
            background: linear-gradient(135deg, #e056fd, #686de0);
            color: white;
            flex: 2;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        .btn-sec {
            background: rgba(255,255,255,0.15);
            color: white;
            flex: 1;
        }

        .history-box {
            max-height: 120px;
            overflow-y: auto;
            width: 100%;
            margin-top: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 8px;
        }

        .history-item {
            font-size: 0.8rem;
            color: #ff9ff3;
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .history-nums {
            color: #ffeaa7;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <header class="interactive">
            <h1>Eurojackpot Mega Mavridis</h1>
            <div class="subtitle">3D Live Magic Draw</div>
        </header>

        <div class="fairy-status" id="fairyStatus">🧚‍♀️ Η Νεράιδα περιμένει το πρόσταγμά σου!</div>

        <div class="results-panel interactive">
            <div class="section-title">⭐ Βασικοί Αριθμοί (1 - 50)</div>
            <div class="balls-row" id="mainSlots">
                <div class="ball-slot">--</div>
                <div class="ball-slot">--</div>
                <div class="ball-slot">--</div>
                <div class="ball-slot">--</div>
                <div class="ball-slot">--</div>
            </div>

            <div class="section-title">💫 Αριθμοί Jackpot (1 - 20)</div>
            <div class="balls-row" id="starSlots">
                <div class="ball-slot star-slot">--</div>
                <div class="ball-slot star-slot">--</div>
            </div>

            <div class="controls">
                <button class="btn btn-main" id="drawBtn" onclick="start3DDraw()">✨ ΕΝΑΡΞΗ ΚΛΗΡΩΣΗΣ</button>
                <button class="btn btn-sec" onclick="clearHistory()">🧹</button>
            </div>

            <div class="history-box" id="historyBox">
                <div style="text-align:center; font-size:0.75rem; color:#888;">Ιστορικό Κληρώσεων</div>
            </div>
        </div>
    </div>

    <script>
        // --- 3D THREE.JS SETUP ---
        let scene, camera, renderer;
        let drumMain, drumStar, fairy;
        let mainBalls = [], starBalls = [];
        let isSpinning = false;

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x080414, 0.03);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const light1 = new THREE.PointLight(0xf1c40f, 2, 50);
            light1.position.set(0, 10, 10);
            scene.add(light1);

            const light2 = new THREE.PointLight(0xe056fd, 2, 50);
            light2.position.set(-10, -5, 5);
            scene.add(light2);

            // Create Glass Drums
            drumMain = createGlassDrum(-3.2, 2.5, 0x1a8cff);
            drumStar = createGlassDrum(3.2, 2.5, 0xff3366);

            // Create Balls Inside
            mainBalls = createBallsInside(drumMain, 50, 0xf1c40f);
            starBalls = createBallsInside(drumStar, 20, 0xff6b81);

            // Fairy (Magical Glowing Sphere with Particle Trail)
            fairy = createFairy();
            scene.add(fairy);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createGlassDrum(x, y, glowColor) {
            const group = new THREE.Group();
            group.position.set(x, y, 0);

            // Glass Sphere
            const geo = new THREE.IcosahedronGeometry(2.2, 3);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.35,
                roughness: 0.1,
                transmission: 0.9,
                thickness: 0.8,
                clearcoat: 1
            });
            const glass = new THREE.Mesh(geo, mat);
            group.add(glass);

            // Metallic Ring Frame
            const ringGeo = new THREE.TorusGeometry(2.25, 0.08, 16, 100);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });
            const ring1 = new THREE.Mesh(ringGeo, ringMat);
            const ring2 = new THREE.Mesh(ringGeo, ringMat);
            ring2.rotation.x = Math.PI / 2;
            group.add(ring1);
            group.add(ring2);

            scene.add(group);
            return group;
        }

        function createBallsInside(drumGroup, count, colorHex) {
            const balls = [];
            const ballGeo = new THREE.SphereGeometry(0.22, 16, 16);
            
            for (let i = 0; i < count; i++) {
                const ballMat = new THREE.MeshStandardMaterial({
                    color: colorHex,
                    roughness: 0.3,
                    metalness: 0.2
                });
                const ball = new THREE.Mesh(ballGeo, ballMat);
                
                // Random position inside drum sphere
                const u = Math.random();
                const r = 1.5 * Math.cbrt(u);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                ball.position.x = r * Math.sin(phi) * Math.cos(theta);
                ball.position.y = r * Math.sin(phi) * Math.sin(theta);
                ball.position.z = r * Math.cos(phi);

                ball.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1
                    )
                };

                drumGroup.add(ball);
                balls.push(ball);
            }
            return balls;
        }

        function createFairy() {
            const fairyGroup = new THREE.Group();
            const coreGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const core = new THREE.Mesh(coreGeo, coreMat);
            fairyGroup.add(core);

            const glowGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xff9ff3, transparent: true, opacity: 0.5 });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            fairyGroup.add(glow);

            return fairyGroup;
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.002;

            // Animate Fairy Floating
            fairy.position.x = Math.sin(time * 1.5) * 4;
            fairy.position.y = Math.cos(time * 2) * 1.5 + 3;
            fairy.position.z = Math.sin(time) * 2 + 2;

            // Rotate Drums & Animate Balls
            if (isSpinning) {
                drumMain.rotation.y += 0.08;
                drumMain.rotation.x += 0.04;
                drumStar.rotation.y -= 0.08;
                drumStar.rotation.x -= 0.04;

                mixBalls(mainBalls, 0.12);
                mixBalls(starBalls, 0.12);
            } else {
                drumMain.rotation.y += 0.005;
                drumStar.rotation.y -= 0.005;
                mixBalls(mainBalls, 0.01);
                mixBalls(starBalls, 0.01);
            }

            renderer.render(scene, camera);
        }

        function mixBalls(ballsList, speedMultiplier) {
            ballsList.forEach(ball => {
                ball.position.addScaledVector(ball.userData.velocity, speedMultiplier * 10);
                if (ball.position.length() > 1.7) {
                    ball.position.normalize().multiplyScalar(1.7);
                    ball.userData.velocity.reflect(ball.position.clone().normalize());
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- DRAW LOGIC ---
        async function start3DDraw() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('drawBtn').disabled = true;

            const status = document.getElementById('fairyStatus');
            status.innerHTML = "🧚‍♀️ Η Νεράιδα ανακατεύει τη μαγική γυάλα...";

            // Reset Slots
            const mSlots = document.querySelectorAll('#mainSlots .ball-slot');
            const sSlots = document.querySelectorAll('#starSlots .ball-slot');
            mSlots.forEach(s => { s.innerText = '--'; s.className = 'ball-slot'; });
            sSlots.forEach(s => { s.innerText = '--'; s.className = 'ball-slot star-slot'; });

            let mains = getRandomUnique(5, 50).sort((a,b) => a-b);
            let stars = getRandomUnique(2, 20).sort((a,b) => a-b);

            await sleep(2000);

            status.innerHTML = "✨ Φανέρωση τυχερών αριθμών!";

            for (let i = 0; i < 5; i++) {
                await sleep(400);
                mSlots[i].innerText = mains[i] < 10 ? '0' + mains[i] : mains[i];
                mSlots[i].classList.add('filled');
            }

            for (let i = 0; i < 2; i++) {
                await sleep(400);
                sSlots[i].innerText = stars[i] < 10 ? '0' + stars[i] : stars[i];
                sSlots[i].classList.add('filled');
            }

            isSpinning = false;
            status.innerHTML = "🎉 Η κλήρωση ολοκληρώθηκε!";
            document.getElementById('drawBtn').disabled = false;

            saveToHistory(mains, stars);
        }

        function saveToHistory(mains, stars) {
            const box = document.getElementById('historyBox');
            const time = new Date().toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
            
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span>${time}</span><span class="history-nums">${mains.map(n=>n<10?'0'+n:n).join(' ')} + ${stars.map(n=>n<10?'0'+n:n).join(' ')}</span>`;
            
            box.appendChild(item);
            box.scrollTop = box.scrollHeight;
        }

        function clearHistory() {
            document.getElementById('historyBox').innerHTML = '<div style="text-align:center; font-size:0.75rem; color:#888;">Ιστορικό Κληρώσεων</div>';
        }

        function getRandomUnique(count, max) {
            let arr = [];
            while(arr.length < count){
                let r = Math.floor(Math.random() * max) + 1;
                if(arr.indexOf(r) === -1) arr.push(r);
            }
            return arr;
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // Start
        window.onload = init3D;
    </script>
</body>
</html>
