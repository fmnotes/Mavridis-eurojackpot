<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eurojackpot Mega Mavridis Live</title>

    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b0e3d 0%, #070314 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 10px;
        }

        #magicCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        header {
            text-align: center;
            margin-top: 2px;
            z-index: 2;
        }

        h1 {
            font-size: 1.25rem;
            color: #f1c40f;
            text-shadow: 0 0 18px rgba(241, 196, 15, 0.9), 0 0 5px rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.65rem;
            color: #ff9ff3;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,159,243,0.8);
        }

        /* ✨ Μαγική Κεντρική Νεράιδα */
        .center-fairy-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            margin: 2px 0;
        }

        .center-fairy-circle {
            width: 86px;
            height: 86px;
            background: radial-gradient(circle, rgba(255, 159, 243, 0.5) 0%, rgba(104, 109, 224, 0.3) 60%, rgba(241, 196, 15, 0.15) 100%);
            border: 3px solid #ff9ff3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 0 30px rgba(255, 159, 243, 0.9), 0 0 50px rgba(241, 196, 15, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.8);
            animation: centerFairyFloat 2.6s ease-in-out infinite;
            position: relative;
        }

        .fairy-wand {
            position: absolute;
            top: 2px;
            right: -2px;
            font-size: 22px;
            filter: drop-shadow(0 0 12px #ffffff) drop-shadow(0 0 20px #ff9ff3);
            transform-origin: bottom left;
            transition: transform 0.2s ease-in-out;
        }

        .fairy-wand.casting {
            animation: wandCastAction 0.5s ease-in-out alternate infinite;
        }

        .sparkle-star {
            position: absolute;
            font-size: 13px;
            color: #ffeaa7;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #fff;
            animation: sparkleGlow 1.6s ease-in-out infinite alternate;
        }

        .star-1 { top: -6px; left: 4px; animation-delay: 0s; }
        .star-2 { bottom: 2px; right: 2px; animation-delay: 0.5s; }
        .star-3 { bottom: -4px; left: 8px; animation-delay: 1s; }

        @keyframes centerFairyFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.07); }
        }

        @keyframes wandCastAction {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(-35deg) scale(1.4); filter: drop-shadow(0 0 25px #ffeaa7); }
            100% { transform: rotate(20deg) scale(1.3); filter: drop-shadow(0 0 30px #ff9ff3); }
        }

        @keyframes sparkleGlow {
            0% { opacity: 0.2; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        .fairy-banner {
            text-align: center;
            font-size: 0.82rem;
            color: #ff9ff3;
            text-shadow: 0 0 12px rgba(255, 159, 243, 0.9);
            min-height: 18px;
            font-weight: bold;
            z-index: 2;
            margin-top: 4px;
        }

        /* Κληρωτίδες */
        .top-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 480px;
            z-index: 2;
        }

        .drum-section {
            background: rgba(30, 15, 60, 0.85);
            border: 1.5px solid rgba(241, 196, 15, 0.5);
            border-radius: 18px;
            padding: 6px 5px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 0 15px rgba(224,86,253,0.1);
            backdrop-filter: blur(8px);
        }

        .drum-title {
            font-size: 0.72rem;
            font-weight: bold;
            color: #ffeaa7;
            margin-bottom: 3px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255,234,167,0.6);
        }

        .drum-3d-wrapper {
            position: relative;
            width: 105px;
            height: 105px;
            margin-bottom: 5px;
            perspective: 600px;
        }

        /* 🔮 Οπτικό Εφέ 3D Περιστρεφόμενης Γυάλας */
        .drum-sphere {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.4), rgba(15, 8, 40, 0.95));
            border: 3.5px solid #d4af37;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 22px rgba(241, 196, 15, 0.5);
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        /* Γραμμές πλέγματος στη γυάλα για να φαίνεται η περιστροφή */
        .drum-sphere::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 215, 0, 0.35);
            pointer-events: none;
        }

        .drum-sphere::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 1.5px dotted rgba(255, 159, 243, 0.3);
            pointer-events: none;
        }

        .hatch {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 15px;
            background: linear-gradient(135deg, #b8860b, #ffd700);
            border-radius: 5px 5px 0 0;
            border: 1px solid #fff;
            z-index: 10;
            transition: transform 0.3s;
            font-size: 6.5px;
            font-weight: bold;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(255,215,0,0.8);
        }

        .hatch.open {
            transform: translateX(-50%) translateY(10px);
            background: #ff6b81;
            color: #fff;
            box-shadow: 0 0 10px #ff6b81;
        }

        .ball-inner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #f1c40f);
            color: #140b2b;
            font-weight: bold;
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
            transition: transform 0.05s linear;
        }

        .star-ball-inner {
            background: radial-gradient(circle at 30% 30%, #ffffff, #ff6b81);
            color: #ffffff;
        }

        .slots-container {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .slot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #19102f;
            border: 2px dashed #6c5ce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            font-weight: bold;
            color: #a29bfe;
            transition: all 0.4s;
        }

        .slot.filled {
            background: radial-gradient(circle at 30% 30%, #f39c12, #d35400);
            border: 2px solid #f1c40f;
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.9);
        }

        .star-slot.filled {
            background: radial-gradient(circle at 30% 30%, #ff6b81, #c0392b);
            border: 2px solid #ff7675;
            box-shadow: 0 0 12px rgba(255, 107, 129, 0.9);
        }

        .control-panel {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            z-index: 2;
        }

        .btn-draw {
            background: linear-gradient(135deg, #e056fd, #686de0);
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 0.88rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            flex: 2;
            box-shadow: 0 4px 18px rgba(224, 86, 253, 0.5);
            transition: transform 0.1s;
        }

        .btn-draw:active { transform: scale(0.97); }

        .btn-clear {
            background: rgba(235, 77, 75, 0.85);
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 0.78rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 4px 15px rgba(235, 77, 75, 0.4);
        }

        /* Αποθηκευμένες Στήλες Ιστορικού */
        .history-panel {
            background: rgba(25, 12, 50, 0.88);
            border: 1px solid rgba(241, 196, 15, 0.4);
            border-radius: 16px;
            padding: 6px 10px;
            width: 100%;
            max-width: 480px;
            max-height: 105px;
            overflow-y: auto;
            z-index: 2;
            margin-bottom: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .history-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 8px;
            padding: 4px 8px;
            margin-bottom: 3px;
            font-size: 0.65rem;
            border-left: 2px solid #e056fd;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            color: #ff9ff3;
            font-weight: bold;
        }

        .history-balls-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .mini-ball {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f39c12, #d35400);
            color: #fff;
            font-weight: bold;
            font-size: 0.52rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-star {
            background: radial-gradient(circle at 30% 30%, #ff6b81, #c0392b);
        }

        .flying-ball {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.6rem;
            z-index: 1000;
            transition: all 0.75s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: none;
            box-shadow: 0 0 15px #ffd700, 0 0 25px #ff9ff3;
        }

        .magic-dust-particle {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: dustFade 0.6s forwards ease-out;
        }

        @keyframes dustFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.2) translateY(10px); }
        }
    </style>
</head>
