<html lang="el">
<head>

    <title>Eurojackpot Mega Mavridis Live</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #09122c, #1b1b3a, #2c163a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.8rem;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.7);
            margin-bottom: 3px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #ff9ff3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 480px;
            align-items: center;
        }

        .fairy-banner {
            text-align: center;
            font-size: 1rem;
            color: #ff9ff3;
            font-weight: bold;
            min-height: 24px;
            text-shadow: 0 0 10px rgba(255,159,243,0.6);
        }

        .drum-card {
            background: rgba(25, 12, 50, 0.85);
            border: 2px solid rgba(241, 196, 15, 0.4);
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .drum-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffeaa7;
            margin-bottom: 10px;
            text-align: center;
        }

        .mobile-drum {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.25), rgba(15, 8, 40, 0.95));
            border: 4px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 0 15px rgba(241, 196, 15, 0.4);
            margin-bottom: 12px;
            overflow: hidden;
        }

        .mobile-drum.spinning {
            animation: drumRotate 0.5s linear infinite;
        }

        @keyframes drumRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .drum-center-text {
            font-size: 1rem;
            color: #ff9ff3;
            font-weight: bold;
            text-align: center;
        }

        .slots-container {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .slot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #19102f;
            border: 2px dashed #6c5ce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #a29bfe;
        }

        .slot.filled {
            background: radial-gradient(circle at 30% 30%, #f39c12, #d35400);
            border: 2px solid #f1c40f;
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.8);
        }

        .star-slot.filled {
            background: radial-gradient(circle at 30% 30%, #ff6b81, #c0392b);
            border: 2px solid #ff7675;
            box-shadow: 0 0 12px rgba(255, 107, 129, 0.8);
        }

        .control-panel {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-top: 5px;
        }

        .btn-draw {
            background: linear-gradient(135deg, #e056fd, #686de0);
            color: #fff;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(224, 86, 253, 0.4);
            flex: 2;
        }

        .btn-clear {
            background: linear-gradient(135deg, #eb4d4b, #b71540);
            color: #fff;
            border: none;
            padding: 15px 15px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            flex: 1;
        }

        .history-card {
            background: rgba(25, 12, 50, 0.85);
            border: 2px solid rgba(241, 196, 15, 0.3);
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            max-height: 220px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
            text-align: center;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #ff9ff3;
        }

        .history-balls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .h-ball {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f39c12;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .h-star {
            background: #ff6b81;
        }

        .empty-history {
            text-align: center;
            color: #a4b0be;
            font-size: 0.85rem;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Eurojackpot Mega Mavridis</h1>
        <div class="subtitle">✨ Μαγική Κλήρωση ✨</div>
    </header>

    <div class="app-container">
        
        <div class="fairy-banner" id="fairyBanner">🧚‍♀️ Η νεράιδα είναι έτοιμη!</div>

        <div class="drum-card">
            <div class="drum-title">⭐ Βασικοί Αριθμοί (1 - 50)</div>
            <div class="mobile-drum" id="drumMain">
                <div class="drum-center-text">5 / 50</div>
            </div>
            <div class="slots-container" id="slotsMain">
                <div class="slot">--</div>
                <div class="slot">--</div>
                <div class="slot">--</div>
                <div class="slot">--</div>
                <div class="slot">--</div>
            </div>
        </div>

        <div class="drum-card">
            <div class="drum-title">💫 Jackpot (1 - 20)</div>
            <div class="mobile-drum" id="drumStars">
                <div class="drum-center-text">2 / 20</div>
            </div>
            <div class="slots-container" id="slotsStars">
                <div class="slot star-slot">--</div>
                <div class="slot star-slot">--</div>
            </div>
        </div>

        <div class="control-panel">
            <button class="btn-draw" id="btnDraw" onclick="startDraw()">🪄 ΚΛΗΡΩΣΗ</button>
            <button class="btn-clear" onclick="clearHistory()">ΚΑΘΑΡΙΣΜΟΣ</button>
        </div>

        <div class="history-card">
            <div class="history-title">🌟 Αποθηκευμένες Στήλες</div>
            <div id="historyList">
                <div class="empty-history" id="emptyMsg">Δεν υπάρχουν στήλες ακόμα.</div>
            </div>
        </div>

    </div>

    <script>
        const TOTAL_MAIN = 50;
        const TOTAL_STARS = 20;
        let isDrawing = false;
        let savedColumns = [];

        async function startDraw() {
            if (isDrawing) return;
            isDrawing = true;
            document.getElementById('btnDraw').disabled = true;

            const banner = document.getElementById('fairyBanner');
            const drumMain = document.getElementById('drumMain');
            const drumStars = document.getElementById('drumStars');

            banner.innerHTML = "🧚‍♀️ Η νεράιδα ανακατεύει τα μπαλάκια...";
            drumMain.classList.add('spinning');
            drumStars.classList.add('spinning');

            const mainSlots = document.querySelectorAll('#slotsMain .slot');
            const starSlots = document.querySelectorAll('#slotsStars .slot');
            mainSlots.forEach(s => { s.innerText = '--'; s.className = 'slot'; });
            starSlots.forEach(s => { s.innerText = '--'; s.className = 'slot star-slot'; });

            let drawnMains = getRandomUnique(5, TOTAL_MAIN).sort((a,b) => a-b);
            let drawnStars = getRandomUnique(2, TOTAL_STARS).sort((a,b) => a-b);

            await sleep(1500);

            drumMain.classList.remove('spinning');
            drumStars.classList.remove('spinning');
            banner.innerHTML = "✨ Εμφάνιση τυχερών αριθμών!";

            for (let i = 0; i < 5; i++) {
                await sleep(250);
                mainSlots[i].innerText = drawnMains[i] < 10 ? '0' + drawnMains[i] : drawnMains[i];
                mainSlots[i].classList.add('filled');
            }

            for (let i = 0; i < 2; i++) {
                await sleep(250);
                starSlots[i].innerText = drawnStars[i] < 10 ? '0' + drawnStars[i] : drawnStars[i];
                starSlots[i].classList.add('filled');
            }

            const now = new Date();
            const timeString = now.toLocaleDateString('el-GR') + ' ' + now.toLocaleTimeString('el-GR');
            
            savedColumns.push({
                mains: [...drawnMains],
                stars: [...drawnStars],
                time: timeString
            });
            renderHistory();

            banner.innerHTML = "🎉 Η κλήρωση ολοκληρώθηκε!";
            isDrawing = false;
            document.getElementById('btnDraw').disabled = false;
        }

        function renderHistory() {
            const listElem = document.getElementById('historyList');
            const emptyMsg = document.getElementById('emptyMsg');
            if (emptyMsg) emptyMsg.style.display = 'none';

            listElem.innerHTML = '';
            savedColumns.forEach((col, index) => {
                let itemDiv = document.createElement('div');
                itemDiv.className = 'history-item';

                let header = document.createElement('div');
                header.className = 'history-header';
                header.innerHTML = `<span><strong>Στήλη #${index + 1}</strong></span><span>${col.time}</span>`;
                itemDiv.appendChild(header);

                let ballsContainer = document.createElement('div');
                ballsContainer.className = 'history-balls';

                col.mains.forEach(num => {
                    let b = document.createElement('div');
                    b.className = 'h-ball';
                    b.innerText = num < 10 ? '0' + num : num;
                    ballsContainer.appendChild(b);
                });

                col.stars.forEach(num => {
                    let b = document.createElement('div');
                    b.className = 'h-ball h-star';
                    b.innerText = num < 10 ? '0' + num : num;
                    ballsContainer.appendChild(b);
                });

                itemDiv.appendChild(ballsContainer);
                listElem.appendChild(itemDiv);
            });
            listElem.scrollTop = listElem.scrollHeight;
        }

        function clearHistory() {
            savedColumns = [];
            document.getElementById('historyList').innerHTML = '<div class="empty-history" id="emptyMsg">Δεν υπάρχουν στήλες ακόμα.</div>';
            document.getElementById('fairyBanner').innerHTML = "🧚‍♀️ Η νεράιδα είναι έτοιμη!";
        }

        function getRandomUnique(count, max) {
            let arr = [];
            while(arr.length < count){
                let r = Math.floor(Math.random() * max) + 1;
                if(arr.indexOf(r) === -1) arr.push(r);
            }
            return arr;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
