<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Eurojackpot">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">

    <title>Eurojackpot Mega Mavridis Live 3D</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #1b0b2e 0%, #06020c 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 5px;
            background: rgba(15, 8, 30, 0.75);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(241, 196, 15, 0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        h1 {
            font-size: 1.4rem;
            color: #f1c40f;
            text-shadow: 0 0 12px rgba(241, 196, 15, 0.8);
        }

        .subtitle {
            font-size: 0.75rem;
            color: #ff9ff3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fairy-status {
            font-size: 0.95rem;
            color: #ff9ff3;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,159,243,0.8);
            margin: 6px 0;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,159,243,0.3);
        }

        .results-panel {
            background: rgba(18, 10, 36, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(241, 196, 15, 0.5);
            border-radius: 20px;
            padding: 12px;
            width: 100%;
            margin-top: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .section-title {
            font-size: 0.8rem;
            color: #ffeaa7;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-align: center;
        }

        .balls-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .ball-slot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(241, 196, 15, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #f1c40f;
            transition: all 0.4s ease;
        }

        .ball-slot.star-slot {
            border-color: rgba(255, 107, 129, 0.5);
            color: #ff7675;
        }

        .ball-slot.filled {
            background: radial-gradient(circle at 35% 35%, #ffeaa7, #d35400);
            border: 2px solid #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.9);
            transform: scale(1.1);
        }

        .ball-slot.star-slot.filled {
            background: radial-gradient(circle at 35% 35%, #ff7675, #c0392b);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 107, 129, 0.9);
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 8px;
        }

        .btn {
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .btn-main {
            background: linear-gradient(135deg, #e056fd, #686de0);
            color: white;
            flex: 2;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        .btn-sec {
            background: rgba(255,255,255,0.15);
            color: white;
            flex: 1;
        }

        .history-box {
            max-height: 100px;
            overflow-y: auto;
            width: 100%;
            margin-top: 8px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 6px;
        }

        .history-item {
            font-size: 0.75rem;
            color: #ff9ff3;
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .history-nums {
            color: #ffeaa7;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <header class="interactive">
            <h1>Eurojackpot Mega Mavridis</h1>
            <div class="subtitle">Magical Live Draw</div>
        </header>

        <div class="fairy-status" id="fairyStatus">🧚‍♀️ Η Νεράιδα ετοιμάζει τα μαγικά μπαλάκια!</div>

        <div class="results-panel interactive">
            <div class="section-title">⭐ Βασικοί Αριθμοί (1 - 50)</div>
            <div class="balls-row" id="mainSlots">
                <div class="ball-slot">--</div>
                <div class="ball-slot">--</div>
                <div class="ball-slot">--</div>
                <div class="ball-slot">--</div>
                <div class="ball-slot">--</div>
            </div>

            <div class="section-title">💫 Αριθμοί Jackpot (1 - 20)</div>
            <div class="balls-row" id="starSlots">
                <div class="ball-slot star-slot">--</div>
                <div class="ball-slot star-slot">--</div>
            </div>

            <div class="controls">
                <button class="btn btn-main" id="drawBtn" onclick="startMagicalDraw()">🪄 ΜΑΓΙΚΗ ΚΛΗΡΩΣΗ</button>
                <button class="btn btn-sec" onclick="clearHistory()">🧹</button>
            </div>

            <div class="history-box" id="historyBox">
                <div style="text-align:center; font-size:0.7rem; color:#888;">Ιστορικό Κληρώσεων</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let drumMain, drumStar, fairyGroup;
        let mainBalls = [], starBalls = [];
        let isDrawing = false;

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x080414, 0.025);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 11);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Φωτισμός
            const ambient = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambient);

            const pLight1 = new THREE.PointLight(0xf1c40f, 2.5, 40);
            pLight1.position.set(0, 8, 8);
            scene.add(pLight1);

            const pLight2 = new THREE.PointLight(0xe056fd, 2, 30);
            pLight2.position.set(-6, -2, 5);
            scene.add(pLight2);

            // Κληρωτίδες
            drumMain = createLuxuryDrum(-2.8, 1.8);
            drumStar = createLuxuryDrum(2.8, 1.8);

            // Μπαλάκια με αριθμούς μέσα στις κληρωτίδες
            mainBalls = createNumberedBalls(drumMain, 50, 0xf1c40f);
            starBalls = createNumberedBalls(drumStar, 20, 0xff6b81);

            // Τρισδιάστατη Νεράιδα
            fairyGroup = createDetailedFairy();
            scene.add(fairyGroup);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createLuxuryDrum(x, y) {
            const group = new THREE.Group();
            group.position.set(x, y, 0);

            // Γυάλινη Σφαίρα Κληρωτίδας
            const geo = new THREE.SphereGeometry(2.1, 32, 32);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3,
                roughness: 0.05,
                transmission: 0.95,
                thickness: 1.2,
                clearcoat: 1
            });
            const glass = new THREE.Mesh(geo, mat);
            group.add(glass);

            // Χρυσή Βάση και Στεφάνη
            const baseGeo = new THREE.CylinderGeometry(1.2, 1.6, 0.6, 32);
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });
            const base = new THREE.Mesh(baseGeo, goldMat);
            base.position.y = -2.1;
            group.add(base);

            const ringGeo = new THREE.TorusGeometry(2.15, 0.06, 16, 100);
            const ring = new THREE.Mesh(ringGeo, goldMat);
            group.add(ring);

            scene.add(group);
            return group;
        }

        function createNumberedBalls(drumGroup, count, colorHex) {
            const balls = [];
            for (let i = 1; i <= count; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                // Σχδίαση μπάλας με αριθμό
                ctx.fillStyle = (colorHex === 0xf1c40f) ? '#f39c12' : '#e74c3c';
                ctx.beginPath();
                ctx.arc(64, 64, 58, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(64, 64, 42, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 46px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(i < 10 ? '0' + i : i, 64, 64);

                const texture = new THREE.CanvasTexture(canvas);
                const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.3 });
                const ballGeo = new THREE.SphereGeometry(0.22, 24, 24);
                const ball = new THREE.Mesh(ballGeo, mat);

                // Τυχαία θέση μέσα στη σφαίρα
                const u = Math.random();
                const r = 1.4 * Math.cbrt(u);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                ball.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                ball.userData = {
                    velocity: new THREE.Vector3((Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08)
                };

                drumGroup.add(ball);
                balls.push(ball);
            }
            return balls;
        }

        function createDetailedFairy() {
            const group = new THREE.Group();
            
            // Σώμα / Κεφάλι Νεράιδας (Λαμπερή σφαίρα)
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff9ff3, emissive: 0xff6b81, emissiveIntensity: 0.6 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), bodyMat);
            group.add(head);

            // Φτερά Νεράιδας
            const wingGeo = new THREE.ConeGeometry(0.3, 0.8, 4);
            const wingMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, transmission: 0.9 });
            
            const wing1 = new THREE.Mesh(wingGeo, wingMat);
            wing1.rotation.z = Math.PI / 3;
            wing1.position.set(-0.3, 0.2, 0);
            group.add(wing1);

            const wing2 = new THREE.Mesh(wingGeo, wingMat);
            wing2.rotation.z = -Math.PI / 3;
            wing2.position.set(0.3, 0.2, 0);
            group.add(wing2);

            group.position.set(0, 4.2, 1);
            return group;
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.002;

            // Κίνηση Νεράιδας (Πετάει χαριτωμένα πάνω από τις κληρωτίδες)
            fairyGroup.position.x = Math.sin(time * 1.5) * 3.5;
            fairyGroup.position.y = Math.cos(time * 2) * 0.4 + 4.2;
            fairyGroup.rotation.y = Math.sin(time) * 0.3;

            // Περιστροφή κληρωτίδων & κίνηση μπαλών
            if (isDrawing) {
                drumMain.rotation.y += 0.06;
                drumStar.rotation.y -= 0.06;
                updateBalls(mainBalls, 0.1);
                updateBalls(starBalls, 0.1);
            } else {
                drumMain.rotation.y += 0.004;
                drumStar.rotation.y -= 0.004;
                updateBalls(mainBalls, 0.015);
                updateBalls(starBalls, 0.015);
            }

            renderer.render(scene, camera);
        }

        function updateBalls(ballsList, speed) {
            ballsList.forEach(ball => {
                ball.position.addScaledVector(ball.userData.velocity, speed * 8);
                if (ball.position.length() > 1.6) {
                    ball.position.normalize().multiplyScalar(1.6);
                    ball.userData.velocity.reflect(ball.position.clone().normalize());
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ΜΑΓΙΚΗ ΡΟΗ ΚΛΗΡΩΣΗΣ (Ένα-ένα τα μπαλάκια) ---
        async function startMagicalDraw() {
            if (isDrawing) return;
            isDrawing = true;
            document.getElementById('drawBtn').disabled = true;

            const status = document.getElementById('fairyStatus');
            status.innerHTML = "🧚‍♀️ Η Νεράιδα ανακατεύει τη μαγική κληρωτίδα!";

            const mSlots = document.querySelectorAll('#mainSlots .ball-slot');
            const sSlots = document.querySelectorAll('#starSlots .ball-slot');
            mSlots.forEach(s => { s.innerText = '--'; s.className = 'ball-slot'; });
            sSlots.forEach(s => { s.innerText = '--'; s.className = 'ball-slot star-slot'; });

            let mains = getRandomUnique(5, 50).sort((a,b) => a-b);
            let stars = getRandomUnique(2, 20).sort((a,b) => a-b);

            await sleep(2200);

            status.innerHTML = "✨ Έρχονται οι τυχεροί βασικοί αριθμοί...";

            // Εμφάνιση βασικών αριθμών έναν-έναν
            for (let i = 0; i < 5; i++) {
                await sleep(600);
                mSlots[i].innerText = mains[i] < 10 ? '0' + mains[i] : mains[i];
                mSlots[i].classList.add('filled');
            }

            await sleep(500);
            status.innerHTML = "💫 Σειρά για τους αριθμούς Jackpot!";

            // Εμφάνιση jackpot αριθμών έναν-έναν
            for (let i = 0; i < 2; i++) {
                await sleep(600);
                sSlots[i].innerText = stars[i] < 10 ? '0' + stars[i] : stars[i];
                sSlots[i].classList.add('filled');
            }

            isDrawing = false;
            status.innerHTML = "🎉 Η κλήρωση ολοκληρώθηκε με επιτυχία!";
            document.getElementById('drawBtn').disabled = false;

            saveToHistory(mains, stars);
        }

        function saveToHistory(mains, stars) {
            const box = document.getElementById('historyBox');
            const time = new Date().toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
            
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span>${time}</span><span class="history-nums">${mains.map(n=>n<10?'0'+n:n).join(' ')} + ${stars.map(n=>n<10?'0'+n:n).join(' ')}</span>`;
            
            box.appendChild(item);
            box.scrollTop = box.scrollHeight;
        }

        function clearHistory() {
            document.getElementById('historyBox').innerHTML = '<div style="text-align:center; font-size:0.7rem; color:#888;">Ιστορικό Κληρώσεων</div>';
        }

        function getRandomUnique(count, max) {
            let arr = [];
            while(arr.length < count){
                let r = Math.floor(Math.random() * max) + 1;
                if(arr.indexOf(r) === -1) arr.push(r);
            }
            return arr;
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        window.onload = init3D;
    </script>
</body>
</html>
