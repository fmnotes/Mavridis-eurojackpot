<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eurojackpot Mega Mavridis Live</title>
    
    <!-- iOS PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Eurojackpot">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #140b2b 0%, #070314 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
        }

        #magicCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        header {
            text-align: center;
            margin-top: 4px;
            z-index: 2;
        }

        h1 {
            font-size: 1.3rem;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.8);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.68rem;
            color: #ff9ff3;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ✨ Νεράιδα */
        .fairy-container {
            position: fixed;
            top: 7vh;
            left: 4vw;
            z-index: 100;
            pointer-events: none;
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            animation: fairyFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #ff9ff3);
        }

        .fairy-avatar {
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,159,243,0.1) 70%, transparent 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            position: relative;
        }

        .fairy-wand-tip {
            position: absolute;
            top: 6px;
            right: 2px;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #ff9ff3;
        }

        @keyframes fairyFloat {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        .fairy-container.moving-to-main { transform: translate(15vw, 10vh) scale(1.1); }
        .fairy-container.moving-to-stars { transform: translate(65vw, 10vh) scale(1.1); }

        .fairy-banner {
            text-align: center;
            font-size: 0.8rem;
            color: #ff9ff3;
            text-shadow: 0 0 10px rgba(255,159,243,0.8);
            min-height: 20px;
            font-weight: bold;
            z-index: 2;
        }

        /* Κληρωτίδες */
        .top-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 480px;
            z-index: 2;
        }

        .drum-section {
            background: rgba(25, 12, 50, 0.8);
            border: 1.5px solid rgba(241, 196, 15, 0.4);
            border-radius: 18px;
            padding: 8px 5px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
        }

        .drum-title {
            font-size: 0.72rem;
            font-weight: bold;
            color: #ffeaa7;
            margin-bottom: 4px;
            text-align: center;
        }

        .drum-3d-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 6px;
            perspective: 600px;
        }

        .drum-sphere {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.3), rgba(15, 8, 40, 0.92));
            border: 4px solid #d4af37;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 20px rgba(241, 196, 15, 0.4);
            transform-style: preserve-3d;
        }

        .hatch {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 16px;
            background: linear-gradient(135deg, #b8860b, #ffd700);
            border-radius: 6px 6px 0 0;
            border: 1px solid #fff;
            z-index: 10;
            transition: transform 0.3s;
            font-size: 7px;
            font-weight: bold;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hatch.open {
            transform: translateX(-50%) translateY(12px);
            background: #ff6b81;
            color: #fff;
        }

        .ball-inner {
            position: absolute;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #f1c40f);
            color: #140b2b;
            font-weight: bold;
            font-size: 0.52rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }

        .star-ball-inner {
            background: radial-gradient(circle at 30% 30%, #ffffff, #ff6b81);
            color: #ffffff;
        }

        .slots-container {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .slot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #19102f;
            border: 2px dashed #6c5ce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: bold;
            color: #a29bfe;
            transition: all 0.4s;
        }

        .slot.filled {
            background: radial-gradient(circle at 30% 30%, #f39c12, #d35400);
            border: 2px solid #f1c40f;
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.9);
        }

        .star-slot.filled {
            background: radial-gradient(circle at 30% 30%, #ff6b81, #c0392b);
            border: 2px solid #ff7675;
            box-shadow: 0 0 10px rgba(255, 107, 129, 0.9);
        }

        .control-panel {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            z-index: 2;
        }

        .btn-draw {
            background: linear-gradient(135deg, #e056fd, #686de0);
            color: #fff;
            border: none;
            padding: 11px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            flex: 2;
            box-shadow: 0 4px 15px rgba(224, 86, 253, 0.4);
        }

        .btn-clear {
            background: rgba(235, 77, 75, 0.8);
            color: #fff;
            border: none;
            padding: 11px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            flex: 1;
        }

        /* Αποθηκευμένες Στήλες Ιστορικού με Ημερομηνία & Ώρα */
        .history-panel {
            background: rgba(25, 12, 50, 0.85);
            border: 1px solid rgba(241, 196, 15, 0.35);
            border-radius: 16px;
            padding: 8px 10px;
            width: 100%;
            max-width: 480px;
            max-height: 120px;
            overflow-y: auto;
            z-index: 2;
            margin-bottom: 2px;
        }

        .history-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 5px 8px;
            margin-bottom: 4px;
            font-size: 0.68rem;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            color: #ff9ff3;
            font-weight: bold;
        }

        .history-balls-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .mini-ball {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f39c12, #d35400);
            color: #fff;
            font-weight: bold;
            font-size: 0.58rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-star {
            background: radial-gradient(circle at 30% 30%, #ff6b81, #c0392b);
        }

        .flying-ball {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.6rem;
            z-index: 1000;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="fairy-container" id="fairyContainer">
        <div class="fairy-avatar">🧚‍♀️<div class="fairy-wand-tip"></div></div>
    </div>

    <canvas id="magicCanvas"></canvas>

    <header>
        <h1>Eurojackpot Mega Mavridis</h1>
        <div class="subtitle">✨ Magical Live Draw ✨</div>
    </header>

    <div class="fairy-banner" id="fairyBanner">🧚‍♀️ Η νεράιδα περιμένει!</div>

    <div class="top-section">
        <div class="drum-section">
            <div class="drum-title">⭐ Αριθμοί (1-50)</div>
            <div class="drum-3d-wrapper">
                <div class="drum-sphere" id="drumSphereMain">
                    <div class="hatch" id="hatchMain">EXIT</div>
                </div>
            </div>
            <div class="slots-container" id="slotsMain">
                <div class="slot">--</div><div class="slot">--</div><div class="slot">--</div><div class="slot">--</div><div class="slot">--</div>
            </div>
        </div>

        <div class="drum-section">
            <div class="drum-title">💫 Jackpot (1-20)</div>
            <div class="drum-3d-wrapper">
                <div class="drum-sphere" id="drumSphereStars">
                    <div class="hatch" id="hatchStars">EXIT</div>
                </div>
            </div>
            <div class="slots-container" id="slotsStars">
                <div class="slot star-slot">--</div><div class="slot star-slot">--</div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn-draw" id="btnDraw" onclick="startMagicDraw()">🪄 ΕΚΚΙΝΗΣΗ ΚΛΗΡΩΣΗΣ</button>
        <button class="btn-clear" onclick="clearHistory()">🧹 ΚΑΘΑΡΙΣΜΟΣ</button>
    </div>

    <div class="history-panel" id="historyList">
        <div style="text-align:center; font-size:0.68rem; color:#888;" id="emptyMsg">🌟 Αποθηκευμένες Στήλες (με Ημερομηνία & Ώρα)</div>
    </div>

    <script>
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 70; i++) {
            particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, radius: Math.random()*2+0.5, speedY: (Math.random()-0.5)*0.5, speedX: (Math.random()-0.5)*0.5, alpha: Math.random() });
        }

        function drawMagicBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX; p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 230, 160, ${Math.abs(Math.sin(Date.now() * 0.002 + p.alpha))})`;
                ctx.fill();
            });
            requestAnimationFrame(drawMagicBackground);
        }
        drawMagicBackground();

        const TOTAL_MAIN = 50, TOTAL_STARS = 20;
        let ballsMain = [], ballsStars = [], isDrawing = false, audioCtx = null, savedColumns = [];

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'tick') {
                    osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.03);
                } else if (type === 'tink') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
                } else if (type === 'magic') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch(e){}
        }

        function initDrums() {
            const sphereMain = document.getElementById('drumSphereMain');
            const sphereStars = document.getElementById('drumSphereStars');
            sphereMain.querySelectorAll('.ball-inner').forEach(b => b.remove());
            sphereStars.querySelectorAll('.ball-inner').forEach(b => b.remove());
            ballsMain = []; ballsStars = [];

            for (let i = 1; i <= TOTAL_MAIN; i++) {
                const ball = document.createElement('div'); ball.className = 'ball-inner'; ball.innerText = i;
                sphereMain.appendChild(ball); initBallPhysics(ball, 120); ballsMain.push(ball);
            }
            for (let i = 1; i <= TOTAL_STARS; i++) {
                const ball = document.createElement('div'); ball.className = 'ball-inner star-ball-inner'; ball.innerText = i;
                sphereStars.appendChild(ball); initBallPhysics(ball, 120); ballsStars.push(ball);
            }
        }

        function initBallPhysics(ball, size) {
            ball.x = 12 + Math.random() * (size - 35); ball.y = 12 + Math.random() * (size - 35);
            ball.vx = (Math.random() - 0.5) * 3.5; ball.vy = (Math.random() - 0.5) * 3.5;
            ball.style.transform = `translate(${ball.x}px, ${ball.y}px)`;
        }

        function updatePhysics(balls, size, speedFactor, sphereElem) {
            if (isDrawing) {
                let rotY = Math.sin(Date.now() / 180) * 8;
                sphereElem.style.transform = `rotateY(${rotY}deg)`;
            } else { sphereElem.style.transform = `rotateY(0deg)`; }

            let tickPlayed = false;
            balls.forEach(ball => {
                if (ball.hidden) return;
                ball.x += ball.vx * speedFactor; ball.y += ball.vy * speedFactor;
                const radius = 8.5, center = size / 2;
                let dx = ball.x + radius - center, dy = ball.y + radius - center;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > center - radius - 8) {
                    let angle = Math.atan2(dy, dx);
                    ball.x = center - radius + (center - radius - 8) * Math.cos(angle) - radius;
                    ball.y = center - radius + (center - radius - 8) * Math.sin(angle) - radius;
                    let normalX = Math.cos(angle), normalY = Math.sin(angle);
                    let dot = ball.vx * normalX + ball.vy * normalY;
                    ball.vx -= 2 * dot * normalX; ball.vy -= 2 * dot * normalY;
                    if (isDrawing && !tickPlayed && Math.random() > 0.7) { playSound('tick'); tickPlayed = true; }
                }
                ball.style.transform = `translate(${ball.x}px, ${ball.y}px)`;
            });
        }

        function animate() {
            updatePhysics(ballsMain, 120, isDrawing ? 2.5 : 0.6, document.getElementById('drumSphereMain'));
            updatePhysics(ballsStars, 120, isDrawing ? 2.5 : 0.6, document.getElementById('drumSphereStars'));
            requestAnimationFrame(animate);
        }
        initDrums(); animate();

        async function startMagicDraw() {
            if (isDrawing) return;
            initAudio(); isDrawing = true;
            document.getElementById('btnDraw').disabled = true;

            const banner = document.getElementById('fairyBanner');
            const fairy = document.getElementById('fairyContainer');

            fairy.className = "fairy-container moving-to-main";
            banner.innerHTML = "🧚‍♀️ Η νεράιδα ανακατεύει τη γυάλα!";
            playSound('magic');

            const mainSlots = document.querySelectorAll('#slotsMain .slot');
            const starSlots = document.querySelectorAll('#slotsStars .slot');
            mainSlots.forEach(s => { s.innerText = '--'; s.className = 'slot'; });
            starSlots.forEach(s => { s.innerText = '--'; s.className = 'slot star-slot'; });

            initDrums();
            let drawnMains = getRandomUnique(5, TOTAL_MAIN).sort((a,b) => a-b);
            let drawnStars = getRandomUnique(2, TOTAL_STARS).sort((a,b) => a-b);

            await sleep(1800);

            for (let i = 0; i < 5; i++) {
                await extractBall(ballsMain, drawnMains[i], document.getElementById('hatchMain'), mainSlots[i], false);
                await sleep(300);
            }

            fairy.className = "fairy-container moving-to-stars";
            banner.innerHTML = "💫 Σειρά για το Jackpot!";
            playSound('magic');
            await sleep(800);

            for (let i = 0; i < 2; i++) {
                await extractBall(ballsStars, drawnStars[i], document.getElementById('hatchStars'), starSlots[i], true);
                await sleep(300);
            }

            fairy.className = "fairy-container";

            const now = new Date();
            const dateStr = now.toLocaleDateString('el-GR') + ' ' + now.toLocaleTimeString('el-GR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });

            savedColumns.unshift({ mains: [...drawnMains], stars: [...drawnStars], datetime: dateStr });
            renderHistory();

            banner.innerHTML = "🎉 Η κλήρωση ολοκληρώθηκε!";
            isDrawing = false;
            document.getElementById('btnDraw').disabled = false;
        }

        async function extractBall(ballsArray, targetNum, hatchElem, slotElem, isStar) {
            hatchElem.classList.add('open'); playSound('tick');
            await sleep(250);

            let ballElem = ballsArray.find(b => parseInt(b.innerText) === targetNum && !b.hidden) || ballsArray.find(b => !b.hidden);
            if (ballElem) { ballElem.hidden = true; ballElem.style.display = 'none'; }
            hatchElem.classList.remove('open');

            let startRect = hatchElem.getBoundingClientRect();
            let targetRect = slotElem.getBoundingClientRect();

            let flyer = document.createElement('div');
            flyer.className = 'flying-ball ' + (isStar ? 'star-ball-inner' : '');
            if (!isStar) { flyer.style.background = 'radial-gradient(circle at 30% 30%, #ffffff, #f1c40f)'; flyer.style.color = '#140b2b'; }
            flyer.innerText = targetNum < 10 ? '0' + targetNum : targetNum;
            flyer.style.left = startRect.left + 'px'; flyer.style.top = startRect.top + 'px';
            document.body.appendChild(flyer);

            setTimeout(() => { flyer.style.left = targetRect.left + 'px'; flyer.style.top = targetRect.top + 'px'; }, 40);

            await sleep(500); flyer.remove();
            slotElem.innerText = targetNum < 10 ? '0' + targetNum : targetNum;
            slotElem.classList.add('filled'); playSound('tink');
        }

        function renderHistory() {
            const listElem = document.getElementById('historyList');
            listElem.innerHTML = '';
            savedColumns.forEach((col, index) => {
                let itemDiv = document.createElement('div');
                itemDiv.className = 'history-item';
                
                let mainsHtml = col.mains.map(n => `<div class="mini-ball">${n<10?'0'+n:n}</div>`).join('');
                let starsHtml = col.stars.map(n => `<div class="mini-ball mini-star">${n<10?'0'+n:n}</div>`).join('');

                itemDiv.innerHTML = `
                    <div class="history-header">
                        <span>Στήλη #${savedColumns.length - index}</span>
                        <span>🕒 ${col.datetime}</span>
                    </div>
                    <div class="history-balls-row">
                        ${mainsHtml}
                        <span style="color:#f1c40f; font-weight:bold; margin:0 2px;">+</span>
                        ${starsHtml}
                    </div>
                `;
                listElem.appendChild(itemDiv);
            });
        }

        function clearHistory() {
            savedColumns = [];
            document.getElementById('historyList').innerHTML = '<div style="text-align:center; font-size:0.68rem; color:#888;" id="emptyMsg">🌟 Αποθηκευμένες Στήλες (με Ημερομηνία & Ώρα)</div>';
            document.getElementById('fairyBanner').innerHTML = "🧚‍♀️ Η νεράιδα περιμένει!";
        }

        function getRandomUnique(count, max) {
            let arr = [];
            while(arr.length < count){
                let r = Math.floor(Math.random() * max) + 1;
                if(arr.indexOf(r) === -1) arr.push(r);
            }
            return arr;
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    </script>
</body>
</html>
